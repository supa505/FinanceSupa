<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Transaksi</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
  <div class="max-w-[390px] mx-auto bg-gray-50 min-h-screen relative flex flex-col shadow-xl">
    
    <!-- Header -->
    <div class="px-4 pt-6 pb-2 bg-white rounded-b-2xl shadow-sm z-10 flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <button class="p-2 -ml-2 text-gray-500 hover:text-gray-800 rounded-full hover:bg-gray-100 transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-800">Catat Transaksi</h1>
        <div class="w-10"></div>
      </div>
      
      <!-- Toggle Tabs -->
      <div class="flex p-1 bg-gray-100 rounded-xl">
        <button id="tab-expense" onclick="setTab('expense')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white text-red-500 shadow-sm transition-all">Pengeluaran</button>
        <button id="tab-income" onclick="setTab('income')" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all">Pemasukan</button>
      </div>
    </div>

    <!-- Scrollable content area -->
    <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col">
      <!-- Amount Display Area -->
      <div class="px-6 py-8 flex flex-col items-center justify-center flex-1 min-h-[140px]">
        <div id="amount-container" class="text-red-500 flex items-start gap-1 font-bold transition-colors">
          <span class="text-xl mt-2 text-gray-500">Rp</span>
          <span id="amount-display" class="text-5xl tracking-tight">0</span>
        </div>
      </div>

      <div class="bg-white rounded-t-3xl shadow-[0_-4px_10px_rgba(0,0,0,0.05)] pt-5 pb-4 px-4 flex flex-col gap-5 relative z-20">
        
        <!-- Category Selector -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-medium text-gray-600">Kategori</h3>
          </div>
          <div id="category-list-expense" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 px-1">
            <button onclick="selectCategory('makan')" id="cat-makan" class="flex flex-col items-center gap-1 min-w-[64px] category-btn selected">
              <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">🍔</span></div>
              <span class="text-[11px] font-medium text-gray-600 cat-text">Makan</span>
            </button>
            <button onclick="selectCategory('belanja')" id="cat-belanja" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">🛒</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Belanja</span>
            </button>
            <button onclick="selectCategory('tagihan')" id="cat-tagihan" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">💡</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Tagihan</span>
            </button>
            <button onclick="selectCategory('transport')" id="cat-transport" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">🚗</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Transport</span>
            </button>
            <button onclick="selectCategory('hiburan')" id="cat-hiburan" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-pink-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">🎮</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Hiburan</span>
            </button>
            <button onclick="selectCategory('kesehatan')" id="cat-kesehatan" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">💊</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Kesehatan</span>
            </button>
            <button onclick="selectCategory('pendidikan')" id="cat-pendidikan" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-indigo-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">📚</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Pendidikan</span>
            </button>
            <button onclick="selectCategory('lainnya')" id="cat-lainnya" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">➕</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Lainnya</span>
            </button>
          </div>

          <div id="category-list-income" class="hidden gap-4 overflow-x-auto no-scrollbar pb-2 px-1">
             <button onclick="selectCategory('gaji')" id="cat-gaji" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">💰</span></div>
              <span class="text-[11px] font-medium text-gray-600 cat-text">Gaji</span>
            </button>
            <button onclick="selectCategory('freelance')" id="cat-freelance" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">💼</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Freelance</span>
            </button>
            <button onclick="selectCategory('investasi')" id="cat-investasi" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">📈</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Investasi</span>
            </button>
            <button onclick="selectCategory('bonus')" id="cat-bonus" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">🎁</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Bonus</span>
            </button>
            <button onclick="selectCategory('lainnya-inc')" id="cat-lainnya-inc" class="flex flex-col items-center gap-1 min-w-[64px] category-btn">
              <div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-xl shadow-sm border-2 border-transparent transition-all cat-icon"><span class="text-2xl">➕</span></div>
              <span class="text-[11px] font-medium text-gray-500 cat-text">Lainnya</span>
            </button>
          </div>
        </div>

        <!-- Details Row: Account, Note, Date, Photo -->
        <div class="flex flex-col gap-3 border-t border-gray-100 pt-3">
          <div class="flex gap-2">
            <!-- Account -->
            <button class="flex items-center gap-2 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 flex-1 hover:bg-gray-100 transition-colors">
              <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
              <div class="flex flex-col items-start">
                <span class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Sumber</span>
                <span class="text-sm font-semibold text-gray-800">BCA - Utama</span>
              </div>
              <svg class="w-4 h-4 ml-auto text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Date -->
            <button class="flex items-center gap-2 px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 hover:bg-gray-100 transition-colors">
              <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <div class="flex flex-col items-start pr-1">
                <span class="text-[10px] text-gray-500 font-medium uppercase tracking-wider">Tanggal</span>
                <span class="text-sm font-semibold text-gray-800">Hari Ini</span>
              </div>
            </button>
          </div>

          <div class="flex items-center gap-2 bg-gray-50 rounded-xl border border-gray-200 px-3 py-1 focus-within:ring-1 focus-within:ring-gray-300 transition-all">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            <input type="text" placeholder="Tambah catatan..." class="bg-transparent border-none focus:ring-0 text-sm py-2 flex-1 outline-none text-gray-700 placeholder-gray-400">
            <button class="p-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-200 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Numpad & Save -->
      <div class="bg-gray-100 pb-6 px-4 pt-4 mt-auto rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-30 relative">
        <div class="grid grid-cols-3 gap-3 mb-4">
          <button onclick="pressKey('1')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">1</button>
          <button onclick="pressKey('2')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">2</button>
          <button onclick="pressKey('3')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">3</button>
          
          <button onclick="pressKey('4')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">4</button>
          <button onclick="pressKey('5')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">5</button>
          <button onclick="pressKey('6')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">6</button>
          
          <button onclick="pressKey('7')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">7</button>
          <button onclick="pressKey('8')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">8</button>
          <button onclick="pressKey('9')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">9</button>
          
          <button onclick="pressKey('000')" class="h-[56px] bg-white rounded-xl shadow-sm text-xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">000</button>
          <button onclick="pressKey('0')" class="h-[56px] bg-white rounded-xl shadow-sm text-2xl font-medium text-gray-800 active:bg-gray-50 active:scale-95 transition-all">0</button>
          <button onclick="pressBackspace()" class="h-[56px] bg-gray-200 rounded-xl shadow-sm text-xl text-gray-600 flex items-center justify-center active:bg-gray-300 active:scale-95 transition-all">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path></svg>
          </button>
        </div>
        
        <button id="save-btn" class="w-full h-[56px] bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl font-semibold text-lg shadow-[0_4px_14px_rgba(239,68,68,0.39)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <span>Simpan Pengeluaran</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </button>
      </div>

    </div>
  </div>

  <script>
    let currentType = 'expense';
    let amountStr = '0';
    let activeExpenseCat = 'makan';
    let activeIncomeCat = 'gaji';

    const amountDisplay = document.getElementById('amount-display');
    const amountContainer = document.getElementById('amount-container');
    const saveBtn = document.getElementById('save-btn');
    
    // Tab Elements
    const tabExpense = document.getElementById('tab-expense');
    const tabIncome = document.getElementById('tab-income');
    const catListExpense = document.getElementById('category-list-expense');
    const catListIncome = document.getElementById('category-list-income');

    function formatNumber(numStr) {
      if (!numStr || numStr === '0') return '0';
      return parseInt(numStr, 10).toLocaleString('id-ID');
    }

    function updateDisplay() {
      amountDisplay.innerText = formatNumber(amountStr);
      
      // Resize text based on length
      if (amountStr.length > 10) {
        amountDisplay.className = "text-3xl tracking-tight";
      } else if (amountStr.length > 7) {
        amountDisplay.className = "text-4xl tracking-tight";
      } else {
        amountDisplay.className = "text-5xl tracking-tight";
      }
    }

    function pressKey(val) {
      if (amountStr === '0') {
        if (val === '000' || val === '0') return;
        amountStr = val;
      } else {
        if (amountStr.length < 12) {
          amountStr += val;
          // cap length if 000 was pressed
          if (amountStr.length > 12) {
            amountStr = amountStr.substring(0, 12);
          }
        }
      }
      updateDisplay();
    }

    function pressBackspace() {
      if (amountStr.length > 1) {
        amountStr = amountStr.slice(0, -1);
      } else {
        amountStr = '0';
      }
      updateDisplay();
    }

    function setTab(type) {
      currentType = type;
      if (type === 'expense') {
        // Update Tabs
        tabExpense.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-red-500 shadow-sm transition-all";
        tabIncome.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all";
        
        // Update Amount Color
        amountContainer.className = "text-red-500 flex items-start gap-1 font-bold transition-colors";
        
        // Show/Hide Categories
        catListExpense.className = "flex gap-4 overflow-x-auto no-scrollbar pb-2 px-1";
        catListIncome.className = "hidden gap-4 overflow-x-auto no-scrollbar pb-2 px-1";
        
        // Update Save Button
        saveBtn.className = "w-full h-[56px] bg-gradient-to-r from-red-500 to-red-600 text-white rounded-xl font-semibold text-lg shadow-[0_4px_14px_rgba(239,68,68,0.39)] active:scale-[0.98] transition-all flex items-center justify-center gap-2";
        saveBtn.innerHTML = '<span>Simpan Pengeluaran</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
        
        updateCategoryStyles('expense', activeExpenseCat);
      } else {
        // Update Tabs
        tabExpense.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-gray-700 transition-all";
        tabIncome.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-white text-emerald-600 shadow-sm transition-all";
        
        // Update Amount Color
        amountContainer.className = "text-emerald-600 flex items-start gap-1 font-bold transition-colors";
        
        // Show/Hide Categories
        catListExpense.className = "hidden gap-4 overflow-x-auto no-scrollbar pb-2 px-1";
        catListIncome.className = "flex gap-4 overflow-x-auto no-scrollbar pb-2 px-1";
        
        // Update Save Button
        saveBtn.className = "w-full h-[56px] bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-xl font-semibold text-lg shadow-[0_4px_14px_rgba(5,150,105,0.39)] active:scale-[0.98] transition-all flex items-center justify-center gap-2";
        saveBtn.innerHTML = '<span>Simpan Pemasukan</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
        
        updateCategoryStyles('income', activeIncomeCat);
      }
    }

    function selectCategory(catId) {
      if (currentType === 'expense') {
        activeExpenseCat = catId;
        updateCategoryStyles('expense', catId);
      } else {
        activeIncomeCat = catId;
        updateCategoryStyles('income', catId);
      }
    }

    function updateCategoryStyles(type, activeId) {
      const container = type === 'expense' ? catListExpense : catListIncome;
      const btns = container.querySelectorAll('.category-btn');
      const activeColorClass = type === 'expense' ? 'border-red-400' : 'border-emerald-400';
      const activeTextClass = type === 'expense' ? 'text-red-500' : 'text-emerald-600';
      
      btns.forEach(btn => {
        const iconDiv = btn.querySelector('.cat-icon');
        const textSpan = btn.querySelector('.cat-text');
        
        // Reset styles
        iconDiv.classList.remove('border-red-400', 'border-emerald-400', 'scale-110');
        iconDiv.classList.add('border-transparent');
        textSpan.classList.remove('text-red-500', 'text-emerald-600', 'font-bold');
        textSpan.classList.add('text-gray-500', 'font-medium');
        
        // Apply active styles
        if (btn.id === `cat-${activeId}`) {
          iconDiv.classList.remove('border-transparent');
          iconDiv.classList.add(activeColorClass, 'scale-110');
          textSpan.classList.remove('text-gray-500', 'font-medium');
          textSpan.classList.add(activeTextClass, 'font-bold');
        }
      });
    }

    // Initialize styling
    updateCategoryStyles('expense', activeExpenseCat);
  </script>
</body>
</html>
